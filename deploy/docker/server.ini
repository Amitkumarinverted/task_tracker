# =============================================================================
#  Inverted TaskFlow Server - settings for the Docker container
#  Copy this file to the folder set by TASKFLOW_CONFIG_DIR (mounted read-only at /etc/taskflow/conf).
#  After a change:  docker compose restart taskflow-server
#  All paths are paths INSIDE the container and must stay absolute
#  (the server treats relative paths as relative to this file's read-only folder).
# =============================================================================

# ---- network (inside the container - do not change; set TASKFLOW_PORT / TASKFLOW_BIND_IP in .env instead)
bind = 0.0.0.0
port = 8443
# HTTPS certificate and key - the folder TASKFLOW_TLS_DIR is mounted read-only at /etc/taskflow/tls
tls_cert = /etc/taskflow/tls/cert.pem
tls_key = /etc/taskflow/tls/key.pem
# desktop apps connected at the same time (each keeps one instant-update connection open)
max_clients = 300
# requests per second allowed from one computer
rate_limit_per_ip = 30

# ---- storage - TASKFLOW_DATA_DIR is mounted at /var/lib/taskflow (database, WAL files, backups)
database = /var/lib/taskflow/taskflow.db
backup_dir = /var/lib/taskflow/backups
# daily backup time (24 h, container time zone TZ) and how many daily backups to keep
backup_time = 02:00
backup_keep = 30
# empty = log to the container output (docker compose logs); Docker rotates it
log_file =

# ---- company (shown on the sign-in page; can also be changed in the app: Administration > Server)
company_name = Inverted Energy Pvt. Ltd.
company_tagline = Projects - Tasks - Timelines

# ---- sign-in
session_hours = 12
remember_days = 30
# first administrator (used only when the database is created). Leave the password empty:
# a random one is written to /var/lib/taskflow/initial_admin_password.txt
admin_email = admin@taskflow.local
admin_password =
# desktop apps older than this version are asked to update
min_client_version = 1.0.0

# ---- e-mail notifications (optional) - test with:
#   docker compose exec taskflow-server entrypoint.sh --test-email you@inverted.in
email_enabled = 0
smtp_host = smtp.office365.com
smtp_port = 587
# starttls (port 587) | ssl (port 465) | none (internal relay, port 25)
smtp_security = starttls
smtp_user = taskflow@inverted.in
smtp_password =
smtp_from = taskflow@inverted.in
smtp_from_name = Inverted TaskFlow
smtp_verify_cert = 1
